<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D PCB Assembly Viewer - LTRJ Labs</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#FF6600',
                        'brand-dark': '#e65c00',
                        surface: {
                            900: '#0a0a0f',
                            800: '#111118',
                            700: '#1a1a24',
                            600: '#22222e',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "three": "https://esm.sh/three@0.171.0",
            "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.14?external=react,three",
            "@react-three/drei": "https://esm.sh/@react-three/drei@9.120.4?external=react,three,@react-three/fiber",
            "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-mode {
            background: #f9fafb;
            color: #1f2937;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        /* Custom range slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            outline: none;
            transition: background 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #FF6600;
            cursor: pointer;
            border: 3px solid #0a0a0f;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.5), 0 0 20px rgba(255, 102, 0, 0.2);
            transition: box-shadow 0.2s ease, transform 0.15s ease, border-color 0.3s;
        }

        body.light-mode input[type="range"]::-webkit-slider-thumb {
            border-color: #ffffff;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 14px rgba(255, 102, 0, 0.7), 0 0 28px rgba(255, 102, 0, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #FF6600;
            cursor: pointer;
            border: 3px solid #0a0a0f;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
            transition: border-color 0.3s;
        }

        body.light-mode input[type="range"]::-moz-range-thumb {
            border-color: #ffffff;
        }

        /* Loading spinner */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-ring {
            width: 48px;
            height: 48px;
            border: 3px solid #22222e;
            border-top-color: #FF6600;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        body.light-mode .loader-ring {
            border-color: #e5e7eb;
            border-top-color: #FF6600;
        }

        /* Fade in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(17, 17, 24, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* Control buttons standard styling */
        .btn-control {
            background-color: #1a1a24;
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }

        .btn-control:hover {
            background-color: #22222e;
            color: #ffffff;
        }

        body.light-mode .btn-control {
            background-color: #f3f4f6;
            color: #4b5563;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        body.light-mode .btn-control:hover {
            background-color: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useRef, useCallback, useEffect, useMemo, Suspense } from 'react';
        import { createRoot } from 'react-dom/client';
        import { jsx, jsxs, Fragment } from 'react/jsx-runtime';
        import { Canvas, useFrame, useThree } from '@react-three/fiber';
        import { OrbitControls, useGLTF, Html, Center, GizmoHelper, GizmoViewcube } from '@react-three/drei';
        import { Layers, RotateCcw, Move3D, Eye, Box, Maximize2, Sun, Moon, ChevronUp, ChevronDown, ChevronLeft, ChevronRight, Home } from 'lucide-react';
        import * as THREE from 'three';

        // ─── GLTF Model Path ────────────────────────────────────────────────
        const MODEL_PATH = '../../img/RemoteTankMonitoring-Enclosure+TankMountMainBoard.gltf';

        // ─── Configure Draco decoder path globally ──────────────────────────
        useGLTF.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

        // ─── Component group definitions for exploded view ──────────────────
        const COMPONENT_GROUPS = [
            {
                id: 'enclosure',
                label: 'Enclosure',
                color: '#6366f1',
                prefixes: ['FRAME', '.step'],
                offsetMag: 0.006,
            },
            {
                id: 'connectors',
                label: 'Connectors',
                color: '#22d3ee',
                prefixes: ['DB301V', 'SIM8051', '67910', 'TYPE-C', 'JST', 'DSJ0014', 'pin'],
                offsetMag: 0.004,
            },
            {
                id: 'ics',
                label: 'ICs & Modules',
                color: '#f59e0b',
                prefixes: ['ESP32', 'INA219', 'lr62xe', 'SOT23', 'SOT23-3', 'BODY-SOT', 'LEAD-SOT', 'LEAD-DUMMY', 'MOLD'],
                offsetMag: 0.003,
            },
            {
                id: 'passives',
                label: 'Passives',
                color: '#a855f7',
                prefixes: ['res_', 'ceramic_cap_', 'D_0402', 'DO-214', 'led_', '25ZLH', 'SWPA', 'SPM2512', 'TS-1088'],
                offsetMag: 0.002,
            },
            {
                id: 'traces',
                label: 'Traces & Solder',
                color: '#e5e7eb',
                prefixes: ['SOLID'],
                offsetMag: 0.001,
            },
            {
                id: 'pcb',
                label: 'PCB Board',
                color: '#10b981',
                prefixes: ['RemoteTankMonitoring_PCB', 'MainBoard', 'body_4'],
                offsetMag: 0,
            },
        ];

        function classifyNode(name) {
            for (const group of COMPONENT_GROUPS) {
                for (const prefix of group.prefixes) {
                    if (name && name.startsWith(prefix)) {
                        return group;
                    }
                }
            }
            return COMPONENT_GROUPS[COMPONENT_GROUPS.length - 1];
        }

        // ─── PCB Model with strictly vertical on-demand explode ─────────────
        function PCBModel({ explodeFactor, autoRotate }) {
            const gltf = useGLTF(MODEL_PATH);
            const groupRef = useRef();
            const { invalidate: inv } = useThree();

            // Build mesh data once on mount — store original positions and project
            // the parent vertical axis (0, 1, 0) into each child's local coordinate system
            // to enforce strictly vertical translations regardless of local rotation.
            const meshData = useMemo(() => {
                const result = [];
                gltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        const group = classifyNode(child.name);
                        // Freeze material updates
                        if (child.material) {
                            child.material.needsUpdate = false;
                        }
                        
                        // Local up direction vector corresponding to parent-space (0, 1, 0)
                        const upDirection = new THREE.Vector3(0, 1, 0)
                            .applyQuaternion(child.quaternion.clone().invert());
                            
                        result.push({
                            mesh: child,
                            group,
                            origPosition: child.position.clone(),
                            upDirection,
                        });
                    }
                });
                return result;
            }, [gltf.scene]);

            // Apply explode positions only when the factor changes
            useEffect(() => {
                const t = explodeFactor;
                for (const item of meshData) {
                    const offset = item.group.offsetMag * t;
                    // Position is: origPosition + upDirection * offset
                    item.mesh.position.copy(item.origPosition)
                        .addScaledVector(item.upDirection, offset);
                        
                    // Opacity control for board substrate
                    if (item.group.id === 'pcb') {
                        if (item.mesh.material) {
                            const materials = Array.isArray(item.mesh.material) ? item.mesh.material : [item.mesh.material];
                            for (const mat of materials) {
                                mat.transparent = t > 0;
                                mat.opacity = t > 0 ? 0.45 : 1.0;
                                mat.depthWrite = t === 0;
                            }
                        }
                    }
                }
                inv(); // Request a single re-render
            }, [explodeFactor, meshData, inv]);

            // Auto-rotate: only active when enabled, requests renders
            useFrame((state, delta) => {
                if (groupRef.current && autoRotate) {
                    groupRef.current.rotation.y += delta * 0.15;
                    inv();
                }
            });

            const scale = 10;

            return jsx('primitive', {
                ref: groupRef,
                object: gltf.scene,
                scale: [scale, scale, scale],
                rotation: [-Math.PI / 2, 0, 0],
            });
        }

        // ─── Loading Fallback ───────────────────────────────────────────────
        function Loader() {
            return jsx(Html, {
                center: true,
                children: jsx('div', {
                    className: 'flex flex-col items-center gap-4',
                    children: [
                        jsx('div', { className: 'loader-ring', key: 'ring' }),
                        jsx('p', {
                            className: 'text-sm font-medium tracking-wide opacity-80',
                            children: 'Loading 3D Model...',
                            key: 'text',
                        }),
                    ],
                }),
            });
        }

        // ─── Camera Setup (Default Top View) ────────────────────────────────
        function CameraSetup() {
            const { camera } = useThree();
            useEffect(() => {
                // Setup default view looking straight down at the top of the board
                // with a tiny offset to prevent OrbitControls gimbal lock.
                camera.position.set(0.01, 1.5, 0.01);
                camera.lookAt(0, 0, 0);
            }, [camera]);
            return null;
        }

        // ─── Invalidation controller ────────────────────────────────────────
        function InvalidateOnChange({ controlsRef }) {
            const { invalidate: inv } = useThree();
            useEffect(() => {
                const controls = controlsRef.current;
                if (!controls) return;
                const handler = () => inv();
                controls.addEventListener('change', handler);
                return () => controls.removeEventListener('change', handler);
            }, [controlsRef, inv]);
            return null;
        }

        // ─── Controller for View Cube & D-pad rotations ──────────────────────
        function GizmoController({ controlsRef, setGizmoApi }) {
            const { camera, invalidate: inv } = useThree();

            const animateCameraTo = useCallback((newPosition) => {
                const controls = controlsRef.current;
                if (!controls) return;
                const startPos = camera.position.clone();
                const endPos = newPosition.clone();
                const duration = 250; // ms
                const startTime = performance.now();

                const animate = (time) => {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // Easing: easeInOutQuad
                    const t = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

                    camera.position.lerpVectors(startPos, endPos, t);
                    camera.lookAt(controls.target);
                    controls.update();
                    inv();

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };
                requestAnimationFrame(animate);
            }, [camera, controlsRef, inv]);

            const rotateView = useCallback((dir) => {
                const controls = controlsRef.current;
                if (!controls) return;

                const target = controls.target;
                const offset = camera.position.clone().sub(target);

                const angle = (dir === 'left' || dir === 'up') ? -Math.PI / 2 : Math.PI / 2;
                const axis = new THREE.Vector3();

                if (dir === 'left' || dir === 'right') {
                    axis.set(0, 1, 0); // World Y-axis (vertical)
                } else {
                    // Camera local right axis (horizontal pitch)
                    axis.set(1, 0, 0).applyQuaternion(camera.quaternion);
                }

                offset.applyAxisAngle(axis, angle);

                const newPos = target.clone().add(offset);
                animateCameraTo(newPos);
            }, [camera, controlsRef, animateCameraTo]);

            const goHome = useCallback(() => {
                animateCameraTo(new THREE.Vector3(0.01, 1.5, 0.01));
            }, [animateCameraTo]);

            useEffect(() => {
                setGizmoApi({ rotateView, goHome });
                return () => setGizmoApi(null);
            }, [setGizmoApi, rotateView, goHome]);

            return null;
        }

        // ─── Main App ──────────────────────────────────────────────────────
        function App() {
            const [explodeFactor, setExplodeFactor] = useState(0);
            const [autoRotate, setAutoRotate] = useState(false); // Start with rotate OFF so top view remains steady
            const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'dark');
            const [gizmoApi, setGizmoApi] = useState(null);
            const sliderRef = useRef(null);
            const controlsRef = useRef(null);

            // Sync theme classes with body
            useEffect(() => {
                document.body.classList.remove('dark-mode', 'light-mode');
                document.body.classList.add(`${theme}-mode`);
                localStorage.setItem('theme', theme);
            }, [theme]);

            const handleSliderChange = useCallback((e) => {
                setExplodeFactor(parseFloat(e.target.value));
            }, []);

            const handleReset = useCallback(() => {
                setExplodeFactor(0);
                if (sliderRef.current) {
                    sliderRef.current.value = 0;
                }
            }, []);

            return jsx('div', {
                className: `w-full h-full relative transition-colors duration-300 ${theme === 'dark' ? 'bg-surface-900' : 'bg-gray-50'}`,
                children: [
                    // ─── 3D Canvas ──────────────────────────────────────
                    jsx(Canvas, {
                        key: 'canvas',
                        frameloop: 'demand',
                        dpr: [1, 2],
                        gl: {
                            antialias: true,
                            alpha: false,
                            powerPreference: 'high-performance',
                            stencil: false,
                            depth: true,
                        },
                        camera: { fov: 35, near: 0.01, far: 100 },
                        style: { background: theme === 'dark' ? '#0a0a0f' : '#f9fafb' },
                        onCreated: ({ gl }) => {
                            gl.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                            gl.toneMapping = THREE.ACESFilmicToneMapping;
                            gl.toneMappingExposure = 1.0;
                            gl.outputColorSpace = THREE.SRGBColorSpace;
                        },
                        children: [
                            jsx(CameraSetup, { key: 'cam' }),
                            jsx('ambientLight', { intensity: theme === 'dark' ? 0.5 : 0.8, key: 'amb' }),
                            jsx('directionalLight', {
                                position: [5, 8, 5],
                                intensity: theme === 'dark' ? 1.2 : 1.5,
                                key: 'dir1',
                            }),
                            jsx('directionalLight', {
                                position: [-3, 4, -4],
                                intensity: theme === 'dark' ? 0.4 : 0.6,
                                key: 'dir2',
                            }),
                            jsx('pointLight', {
                                position: [0, 2, 0],
                                intensity: theme === 'dark' ? 0.2 : 0.1,
                                color: '#FF6600',
                                key: 'pt',
                            }),
                            jsx(Suspense, {
                                fallback: jsx(Loader, {}),
                                children: jsx(Center, {
                                    children: jsx(PCBModel, {
                                        explodeFactor: explodeFactor,
                                        autoRotate: autoRotate,
                                    }),
                                }),
                                key: 'model',
                            }),
                            jsx(OrbitControls, {
                                ref: controlsRef,
                                makeDefault: true, // Required for GizmoHelper
                                enablePan: true,
                                enableZoom: true,
                                enableRotate: true,
                                enableDamping: true,
                                dampingFactor: 0.08,
                                minDistance: 0.2,
                                maxDistance: 15,
                                key: 'controls',
                            }),
                            jsx(InvalidateOnChange, {
                                controlsRef: controlsRef,
                                key: 'invalidator',
                            }),
                            jsx(GizmoController, {
                                controlsRef: controlsRef,
                                setGizmoApi: setGizmoApi,
                                key: 'gizmo-controller',
                            }),
                            jsx(GizmoHelper, {
                                alignment: 'bottom-right',
                                margin: [80, 80],
                                renderPriority: 2,
                                key: 'gizmo-helper',
                                children: jsx(GizmoViewcube, {
                                    strokeColor: theme === 'dark' ? '#9ca3af' : '#4b5563',
                                    textColor: theme === 'dark' ? '#e5e7eb' : '#111827',
                                    color: theme === 'dark' ? '#1a1a24' : '#f3f4f6',
                                    hoverColor: '#FF6600',
                                    opacity: 0.85,
                                }),
                            }),
                        ],
                    }),

                    // ─── Top-Left Title ─────────────────────────────────
                    jsx('div', {
                        key: 'title',
                        className: 'absolute top-4 left-4 fade-in',
                        children: jsxs('div', {
                            className: 'glass-panel rounded-xl px-5 py-3',
                            children: [
                                jsxs('div', {
                                    className: 'flex items-center gap-2 mb-1',
                                    key: 'h',
                                    children: [
                                        jsx(Box, { size: 16, className: 'text-brand', key: 'ico' }),
                                        jsx('span', {
                                            className: 'text-xs font-bold tracking-widest uppercase text-brand',
                                            children: 'LTRJ Labs',
                                            key: 'brand',
                                        }),
                                    ],
                                }),
                                jsx('h1', {
                                    className: `text-base font-bold leading-tight ${theme === 'dark' ? 'text-white' : 'text-gray-900'}`,
                                    children: 'Remote Tank Monitoring',
                                    key: 't',
                                }),
                                jsx('p', {
                                    className: `text-xs mt-0.5 ${theme === 'dark' ? 'text-gray-500' : 'text-gray-600'}`,
                                    children: 'PCB Assembly — Interactive 3D Viewer',
                                    key: 's',
                                }),
                            ],
                        }),
                    }),

                    // ─── Top-Right Legend ────────────────────────────────
                    jsx('div', {
                        key: 'legend',
                        className: 'absolute top-4 right-4 fade-in',
                        children: jsx('div', {
                            className: 'glass-panel rounded-xl px-4 py-3',
                            children: [
                                jsxs('div', {
                                    className: 'flex items-center gap-2 mb-2',
                                    key: 'lh',
                                    children: [
                                        jsx(Layers, { size: 14, className: theme === 'dark' ? 'text-gray-400' : 'text-gray-500', key: 'li' }),
                                        jsx('span', {
                                            className: `text-xs font-semibold uppercase tracking-wider ${theme === 'dark' ? 'text-gray-300' : 'text-gray-700'}`,
                                            children: 'Layers',
                                            key: 'lt',
                                        }),
                                    ],
                                }),
                                jsx('div', {
                                    className: 'flex flex-col gap-1.5',
                                    key: 'lb',
                                    children: COMPONENT_GROUPS.map((g) =>
                                        jsxs('div', {
                                            className: 'flex items-center gap-2',
                                            key: g.id,
                                            children: [
                                                jsx('div', {
                                                    className: 'w-2.5 h-2.5 rounded-full',
                                                    style: { backgroundColor: g.color },
                                                    key: 'dot',
                                                }),
                                                jsx('span', {
                                                    className: `text-xs ${theme === 'dark' ? 'text-gray-400' : 'text-gray-600'}`,
                                                    children: g.label,
                                                    key: 'name',
                                                }),
                                            ],
                                        })
                                    ),
                                }),
                            ],
                        }),
                    }),

                    // ─── View Controller Overlay (D-pad) ────────────────
                    gizmoApi && jsx('div', {
                        key: 'view-controller',
                        className: 'absolute bottom-48 right-6 flex flex-col items-center gap-1 fade-in z-10 select-none',
                        children: [
                            // Up Button
                            jsx('button', {
                                onClick: () => gizmoApi.rotateView('up'),
                                className: 'btn-control w-7 h-7 rounded-full flex items-center justify-center',
                                title: 'Rotate Up 90°',
                                children: jsx(ChevronUp, { size: 14 }),
                            }),
                            // Middle Row
                            jsxs('div', {
                                className: 'flex items-center gap-1',
                                children: [
                                    // Left Button
                                    jsx('button', {
                                        onClick: () => gizmoApi.rotateView('left'),
                                        className: 'btn-control w-7 h-7 rounded-full flex items-center justify-center',
                                        title: 'Rotate Left 90°',
                                        children: jsx(ChevronLeft, { size: 14 }),
                                    }),
                                    // Home (Top View)
                                    jsx('button', {
                                        onClick: () => gizmoApi.goHome(),
                                        className: 'btn-control w-7 h-7 rounded-full flex items-center justify-center bg-brand/20 text-brand border-brand/30 hover:bg-brand/30',
                                        title: 'Top View (Home)',
                                        children: jsx(Home, { size: 12 }),
                                    }),
                                    // Right Button
                                    jsx('button', {
                                        onClick: () => gizmoApi.rotateView('right'),
                                        className: 'btn-control w-7 h-7 rounded-full flex items-center justify-center',
                                        title: 'Rotate Right 90°',
                                        children: jsx(ChevronRight, { size: 14 }),
                                    }),
                                ],
                            }),
                            // Down Button
                            jsx('button', {
                                onClick: () => gizmoApi.rotateView('down'),
                                className: 'btn-control w-7 h-7 rounded-full flex items-center justify-center',
                                title: 'Rotate Down 90°',
                                children: jsx(ChevronDown, { size: 14 }),
                            }),
                        ],
                    }),

                    // ─── Bottom Control Bar ─────────────────────────────
                    jsx('div', {
                        key: 'controls',
                        className: 'absolute bottom-0 left-0 right-0 fade-in',
                        children: jsx('div', {
                            className: 'glass-panel border-t border-white/5 px-6 py-4',
                            children: jsxs('div', {
                                className: 'max-w-3xl mx-auto flex items-center gap-4',
                                children: [
                                    // Label
                                    jsxs('div', {
                                        className: 'flex items-center gap-2 shrink-0',
                                        key: 'label',
                                        children: [
                                            jsx(Move3D, { size: 16, className: 'text-brand', key: 'i' }),
                                            jsx('span', {
                                                className: `text-xs font-semibold uppercase tracking-wider hidden sm:inline ${theme === 'dark' ? 'text-gray-300' : 'text-gray-700'}`,
                                                children: 'Explode',
                                                key: 't',
                                            }),
                                        ],
                                    }),

                                    // Slider
                                    jsx('input', {
                                        ref: sliderRef,
                                        type: 'range',
                                        min: '0',
                                        max: '100',
                                        defaultValue: '0',
                                        step: '1',
                                        className: 'flex-1 cursor-pointer',
                                        onChange: handleSliderChange,
                                        style: {
                                            background: theme === 'dark'
                                                ? `linear-gradient(90deg, #FF6600 0%, #FF6600 ${explodeFactor}%, #22222e ${explodeFactor}%, #22222e 100%)`
                                                : `linear-gradient(90deg, #FF6600 0%, #FF6600 ${explodeFactor}%, #e5e7eb ${explodeFactor}%, #e5e7eb 100%)`
                                        },
                                        key: 'slider',
                                    }),

                                    // Percentage
                                    jsx('span', {
                                        className: 'text-xs font-mono text-brand w-10 text-right tabular-nums font-bold',
                                        children: `${Math.round(explodeFactor)}%`,
                                        key: 'pct',
                                    }),

                                    // Reset Button
                                    jsx('button', {
                                        onClick: handleReset,
                                        className: 'btn-control flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium',
                                        title: 'Reset View',
                                        key: 'reset',
                                        children: [
                                            jsx(RotateCcw, { size: 13, key: 'ri' }),
                                            jsx('span', {
                                                className: 'hidden sm:inline',
                                                children: 'Reset',
                                                key: 'rt',
                                            }),
                                        ],
                                    }),

                                    // Auto-rotate Toggle
                                    jsx('button', {
                                        onClick: () => setAutoRotate((v) => !v),
                                        className: `flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all duration-200 text-xs font-medium ${autoRotate ? 'bg-brand/20 text-brand border border-brand/30 hover:bg-brand/30 hover:text-brand' : 'btn-control'}`,
                                        title: 'Toggle Auto-Rotate',
                                        key: 'rotate',
                                        children: [
                                            jsx(Eye, { size: 13, key: 'ei' }),
                                            jsx('span', {
                                                className: 'hidden sm:inline',
                                                children: 'Spin',
                                                key: 'et',
                                            }),
                                        ],
                                    }),

                                    // Theme Toggle
                                    jsx('button', {
                                        onClick: () => setTheme((t) => (t === 'dark' ? 'light' : 'dark')),
                                        className: 'btn-control flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium',
                                        title: 'Toggle Theme',
                                        key: 'theme-btn',
                                        children: [
                                            theme === 'dark' 
                                                ? jsx(Sun, { size: 13, key: 'sun' }) 
                                                : jsx(Moon, { size: 13, key: 'moon' }),
                                            jsx('span', {
                                                className: 'hidden sm:inline',
                                                children: theme === 'dark' ? 'Light' : 'Dark',
                                                key: 'theme-text',
                                            }),
                                        ],
                                    }),
                                ],
                            }),
                        }),
                    }),

                    // ─── Back Link ──────────────────────────────────────
                    jsx('a', {
                        key: 'back',
                        href: './',
                        className: `absolute bottom-20 left-4 text-xs transition-colors flex items-center gap-1 fade-in ${theme === 'dark' ? 'text-gray-500 hover:text-brand' : 'text-gray-600 hover:text-brand'}`,
                        children: [
                            jsx(Maximize2, { size: 12, key: 'bi' }),
                            jsx('span', { children: 'Back to Project', key: 'bt' }),
                        ],
                    }),
                ],
            });
        }

        // ─── Mount ──────────────────────────────────────────────────────────
        const root = createRoot(document.getElementById('root'));
        root.render(jsx(App, {}));
    </script>
</body>
</html>
