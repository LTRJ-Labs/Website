    <!-- Smooth Page Transition Script -->
    <style>
        body { opacity: 0; transition: opacity 0.1s ease-in-out; }
    </style>
    <script>
        let fadedIn = false;
        function fadeIn() {
            if (!fadedIn) {
                document.body.style.opacity = "1";
                fadedIn = true;
            }
        }
        
        // Fade in immediately as soon as the DOM starts rendering to keep it feeling ultra-fast
        document.addEventListener("DOMContentLoaded", fadeIn);
        setTimeout(fadeIn, 50); // Instant fallback

        // Intercept link clicks to fade out BEFORE navigating
        document.addEventListener("click", function(e) {
            let target = e.target.closest('a');
            if (!target) return;
            
            let href = target.getAttribute('href');
            if (!href) return;
            
            let isInternal = target.host === window.location.host;
            let isSamePage = target.pathname === window.location.pathname || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:');
            let isBlank = target.target === "_blank";
            
            if (isInternal && !isSamePage && !isBlank) {
                e.preventDefault(); // Stop instant navigation
                document.body.style.opacity = "0"; // Trigger fade out
                setTimeout(function() {
                    window.location.href = target.href; // Navigate after fade completes
                }, 100);
            }
        });
        
        // Handle back/forward cache restore
        window.addEventListener("pageshow", function(e) {
            if (e.persisted) {
                fadeIn();
            }
        });
    </script>

    <!-- Custom Form Submit Script (Vanilla JS replacement) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('contactForm');
            var successDiv = document.getElementById('success');
            
            if (form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    
                    successDiv.innerHTML = '';
                    
                    var firstName = document.getElementById('firstName').value.trim();
                    var lastName = document.getElementById('lastName').value.trim();
                    var email = document.getElementById('email').value.trim();
                    var phone = document.getElementById('phone').value.trim();
                    var topic = document.getElementById('topic').value;
                    var messageDetails = document.getElementById('message').value.trim();
                    var websiteUrl = document.getElementById('website_url').value;
                    var agreePrivacy = document.getElementById('agreePrivacy').checked;
                    
                    if (!topic) {
                        showError("Please select a topic.");
                        return;
                    }
                    if (!firstName || !lastName) {
                        showError("Please enter your name.");
                        return;
                    }
                    if (!email) {
                        showError("Please enter your email.");
                        return;
                    }
                    if (!phone) {
                        showError("Please enter your phone number.");
                        return;
                    }
                    if (!messageDetails) {
                        showError("Please enter your message details.");
                        return;
                    }
                    if (!agreePrivacy) {
                        showError("You must agree to the privacy policy to submit a request.");
                        return;
                    }
                    
                    var submitBtn = form.querySelector('button[type=submit]');
                    var originalBtnText = submitBtn.textContent;
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Sending...';
                    
                    var data = new URLSearchParams();
                    data.append('name', firstName + ' ' + lastName);
                    data.append('email', email);
                    data.append('phone', phone);
                    data.append('message', "Topic: " + topic + "\n\nAdditional Details:\n" + messageDetails);
                    data.append('website_url', websiteUrl);
                    
                    var mailUrl = form.getAttribute('data-mail-url') || '../mail/contact_me.php';
                    
                    fetch(mailUrl, {
                        method: 'POST',
                        body: data,
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        }
                    })
                    .then(function(response) {
                        if (response.ok) {
                            showSuccess("Your message has been sent. Thank you!");
                            form.reset();
                        } else {
                            throw new Error("Server error");
                        }
                    })
                    .catch(function(error) {
                        showError("Sorry " + firstName + ", it seems that the mail server is not responding. Please try again later!");
                    })
                    .finally(function() {
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalBtnText;
                    });
                });
                
                var inputs = form.querySelectorAll('input, textarea, select');
                inputs.forEach(function(input) {
                    input.addEventListener('focus', function() {
                        successDiv.innerHTML = '';
                    });
                });
            }
            
            function showError(message) {
                successDiv.innerHTML = "<div class='alert alert-danger' style='background-color:#c0392b; color:#fff; padding:15px; border-radius:4px; margin-bottom:20px; font-family:Montserrat,sans-serif; font-size:12px; font-weight:700; text-transform:uppercase;'>" + message + "</div>";
            }
            
            function showSuccess(message) {
                successDiv.innerHTML = "<div class='alert alert-success' style='background-color:#4cd137; color:#fff; padding:15px; border-radius:4px; margin-bottom:20px; font-family:Montserrat,sans-serif; font-size:12px; font-weight:700; text-transform:uppercase;'>" + message + "</div>";
            }
        });
    </script>
