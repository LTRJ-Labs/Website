    <!-- Contact Form Section -->
    <section id="contact" style="padding-top: 150px; padding-bottom: 80px;">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Request a Consultation</h2>
                    <h3 class="section-subheading text-muted" style="color: #bbb; text-transform: none; font-weight: normal;">Please fill out the form below and we will get back to you as soon as possible.</h3>

                        <!-- Honeypot Field to trap spam bots (visually hidden) -->
                        <div style="display:none;" aria-hidden="true">
                            <label for="website_url">Leave this field blank</label>
                            <input type="text" name="website_url" id="website_url" tabindex="-1" autocomplete="off">
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <select class="form-control" id="topic" required data-validation-required-message="Please select a topic.">
                                        <option value="" disabled selected>Select a Topic *</option>
                                        <option value="Electronics Consultation">Electronics Consultation</option>
                                        <option value="Idea">An Idea</option>
                                        <option value="Electronics Services">Electronics Services</option>
                                    </select>
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="text" class="form-control" placeholder="First Name *" id="firstName" required data-validation-required-message="Please enter your first name.">
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="text" class="form-control" placeholder="Last Name *" id="lastName" required data-validation-required-message="Please enter your last name.">

                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">

                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">

    <!-- Theme Toggle and Custom Form Submit Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('theme-toggle');
            const body = document.body;
            const currentTheme = localStorage.getItem('theme') || 'dark';
            body.classList.add(currentTheme + '-mode');
            toggle.textContent = currentTheme === 'dark' ? '🌙' : '☀️';

            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                const newTheme = body.classList.contains('dark-mode') ? 'light' : 'dark';
                body.classList.remove('dark-mode', 'light-mode');
                body.classList.add(newTheme + '-mode');
                localStorage.setItem('theme', newTheme);
                toggle.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            });
        });

        $(document).ready(function() {
            $("#contactForm input, #contactForm textarea, #contactForm select").jqBootstrapValidation({
                preventSubmit: true,
                submitError: function($form, event, errors) {
                    // additional error messages or events
                },
                submitSuccess: function($form, event) {
                    event.preventDefault(); // prevent default submit behaviour
                    
                    // get values from FORM
                    var firstName = $("input#firstName").val();
                    var lastName = $("input#lastName").val();
                    var name = firstName + " " + lastName;
                    var email = $("input#email").val();
                    var phone = $("input#phone").val();
                    var topic = $("select#topic").val();
                    var messageDetails = $("textarea#message").val();
                    var websiteUrl = $("input#website_url").val(); // Honeypot field value
                    
                    // Construct message content
                    var message = "Topic: " + topic + "\n\nAdditional Details:\n" + messageDetails;
                    
                    var mailUrl = $("#contactForm").attr("data-mail-url") || "../mail/contact_me.php";
                    
                    // Disable button to prevent double submission
                    var $submitBtn = $("#contactForm button[type=submit]");
                    $submitBtn.prop("disabled", true).text("Sending...");

                    $.ajax({
                        url: mailUrl,
                        type: "POST",
                        data: {
                            name: name,
                            email: email,
                            phone: phone,
                            message: message,
                            website_url: websiteUrl // Send honeypot value to backend
                        },
                        cache: false,
                        success: function() {
                            // Success message
                            $('#success').html("<div class='alert alert-success'>");
                            $('#success > .alert-success').html("<button type='button' class='close' data-dismiss='alert' aria-hidden='true'>&times;")
                                .append("</button>");
                            $('#success > .alert-success')
                                .append("<strong>Your message has been sent. Thank you! </strong>");
                            $('#success > .alert-success')
                                .append('</div>');

                            //clear all fields
                            $('#contactForm').trigger("reset");
                        },
                        error: function() {
                            // Fail message
                            $('#success').html("<div class='alert alert-danger'>");
                            $('#success > .alert-danger').html("<button type='button' class='close' data-dismiss='alert' aria-hidden='true'>&times;")
                                .append("</button>");
                            $('#success > .alert-danger').append("<strong>Sorry " + firstName + ", it seems that the mail server is not responding. Please try again later!");
                            $('#success > .alert-danger').append('</div>');
                        },
                        complete: function() {
                            // Re-enable button
                            $submitBtn.prop("disabled", false).text("Send Request");
                        }
                    });
                },
                filter: function() {
                    return $(this).is(":visible");
                },
            });

            // Clear success box on input focus
            $('#contactForm input, #contactForm textarea, #contactForm select').focus(function() {
                $('#success').html('');
            });
        });
    </script>
